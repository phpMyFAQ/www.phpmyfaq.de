name: Deploy

# Publishes the static export to the web server once both test workflows have
# succeeded for the same commit on main. Each test workflow triggers this one
# when it finishes; the gate step checks the other workflow's result and the
# run that arrives second does the deployment. Manual runs skip the gate.
#
# The site lives on all-inkl shared hosting and is uploaded over FTPS with a
# dedicated FTP user created in KAS (FTP > Neuer FTP-Benutzer) whose directory
# is the site's document root, /www/htdocs/w0XXXXXX/www.phpmyfaq.de. The single
# SSH account would be the KAS master login, so FTP is the least-privilege path.
#
# Required repository secrets:
#   FTP_HOST      the KAS server address, w0XXXXXX.kasserver.com
#   FTP_USER      the dedicated FTP user, e.g. w0XXXXXXf1
#   FTP_PASSWORD  its password
# Optional:
#   FTP_SERVER_DIR  directory below the FTP user's root to upload into; "./"
#                   when the user is already pinned to the document root
#
# The action keeps .ftp-deploy-sync-state.json in that directory to upload
# only files whose content changed since the previous deployment.

on:
  workflow_run:
    workflows: ['Vitest Unit Tests', 'Playwright E2E Tests']
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

# Never run two deployments at once; a newer commit supersedes a queued one.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  gate:
    name: Both test workflows green
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    outputs:
      ready: ${{ steps.check.outputs.ready }}
      sha: ${{ steps.check.outputs.sha }}
    steps:
      - name: Check the other workflow's result for this commit
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          for name in "Vitest Unit Tests" "Playwright E2E Tests"; do
            conclusion=$(gh api "repos/${{ github.repository }}/actions/runs?head_sha=$SHA&per_page=50" \
              --jq ".workflow_runs[] | select(.name == \"$name\") | .conclusion" | head -n 1)
            echo "$name: ${conclusion:-not finished}"
            if [ "$conclusion" != "success" ]; then
              echo "ready=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "ready=true" >> "$GITHUB_OUTPUT"

  deploy:
    name: Build and publish
    needs: gate
    if: needs.gate.outputs.ready == 'true'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://www.phpmyfaq.de

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.sha }}
          # Full history: the sitemap takes modification dates from git.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build static export
        run: pnpm build

      - name: Upload out/ over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: out/
          server-dir: ${{ secrets.FTP_SERVER_DIR || './' }}
          # Remove files on the server that no longer exist in the export.
          dangerous-clean-slate: false
          exclude: |
            **/.DS_Store

      - name: Smoke test
        run: |
          for path in / /download/ /news/atom.xml /sitemap.xml; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://www.phpmyfaq.de$path")
            echo "$path -> $code"
            [ "$code" = "200" ] || exit 1
          done