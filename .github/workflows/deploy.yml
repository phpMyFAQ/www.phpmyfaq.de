name: Deploy

# Publishes the static export to the web server once both test workflows have
# succeeded for the same commit on main. Only the Playwright workflow (the
# slower one) triggers this workflow, so there is exactly one Deploy run per
# commit; the gate then waits for the Vitest result if it is not in yet.
# Manual runs skip the gate. If a test workflow is re-run by hand after a
# failure, start the deployment manually as well.
#
# The site lives on all-inkl shared hosting and is uploaded over FTPS with a
# dedicated FTP user created in KAS (FTP > Neuer FTP-Benutzer) whose directory
# is the site's document root, /www/htdocs/w0XXXXXX/www.phpmyfaq.de. The single
# SSH account would be the KAS master login, so FTP is the least-privilege path.
#
# Required repository secrets:
#   FTP_HOST      the KAS server address, w0XXXXXX.kasserver.com
#   FTP_USER      the dedicated FTP user, e.g. w0XXXXXXf1
#   FTP_PASSWORD  its password
# Optional:
#   FTP_SERVER_DIR  directory below the FTP user's root to upload into; "./"
#                   when the user is already pinned to the document root
#
# E-mail notification (sent for every outcome once MAIL_SERVER is set):
#   MAIL_SERVER    SMTP host, for all-inkl the KAS server address
#   MAIL_PORT      optional, defaults to 465 (implicit TLS)
#   MAIL_USERNAME  mailbox login, e.g. m0XXXXXX
#   MAIL_PASSWORD  its password
#   MAIL_FROM      sender address of that mailbox
#   MAIL_TO        recipient(s), comma separated
#
# The action keeps .ftp-deploy-sync-state.json in that directory to upload
# only files whose content changed since the previous deployment.

on:
  workflow_run:
    workflows: ['Playwright E2E Tests']
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

# Never run two deployments at once; a newer commit supersedes a queued one.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  gate:
    name: Both test workflows green
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    outputs:
      ready: ${{ steps.check.outputs.ready }}
      sha: ${{ steps.check.outputs.sha }}
    steps:
      - name: Wait for the Vitest result for this commit
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Vitest normally finishes long before Playwright; poll for up to 15 minutes in case it has not.
          for attempt in $(seq 1 30); do
            conclusion=$(gh api "repos/${{ github.repository }}/actions/runs?head_sha=$SHA&per_page=50" \
              --jq '.workflow_runs[] | select(.name == "Vitest Unit Tests") | .conclusion' | head -n 1)
            case "$conclusion" in
              success)
                echo "Vitest Unit Tests: success"
                echo "ready=true" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
              failure|cancelled|timed_out|startup_failure)
                echo "Vitest Unit Tests: $conclusion, not deploying"
                echo "ready=false" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
              *)
                echo "Vitest Unit Tests: not finished yet (attempt $attempt)"
                sleep 30
                ;;
            esac
          done
          echo "::error::Vitest Unit Tests did not finish in time."
          echo "ready=false" >> "$GITHUB_OUTPUT"
          exit 1

  deploy:
    name: Build and publish
    needs: gate
    if: needs.gate.outputs.ready == 'true'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://www.phpmyfaq.de

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.sha }}
          # Full history: the sitemap takes modification dates from git.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build static export
        run: pnpm build

      # Shared hosting resets FTPS data connections now and then (ECONNRESET on
      # the data socket). The sync state on the server makes a second attempt
      # cheap, so one retry after a short pause covers that.
      - name: Upload out/ over FTPS
        id: upload
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: out/
          server-dir: ${{ secrets.FTP_SERVER_DIR || './' }}
          # Remove files on the server that no longer exist in the export.
          dangerous-clean-slate: false
          exclude: |
            **/.DS_Store

      - name: Wait before retrying the upload
        if: steps.upload.outcome == 'failure'
        run: sleep 60

      - name: Retry upload over FTPS
        if: steps.upload.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: out/
          server-dir: ${{ secrets.FTP_SERVER_DIR || './' }}
          dangerous-clean-slate: false
          exclude: |
            **/.DS_Store

      - name: Smoke test
        run: |
          for path in / /download/ /news/atom.xml /sitemap.xml; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://www.phpmyfaq.de$path")
            echo "$path -> $code"
            [ "$code" = "200" ] || exit 1
          done

  notify:
    name: E-mail the result
    needs: [gate, deploy]
    # Runs whenever the gate ran, so a deployment that was skipped because
    # Vitest was red is reported too. If the Playwright run itself failed, this
    # workflow never gets past the gate and GitHub's own failure mail applies.
    if: always() && needs.gate.result == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Describe the outcome
        id: outcome
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.gate.outputs.sha }}
          RESULT: ${{ needs.deploy.result }}
        run: |
          case "$RESULT" in
            success) subject="✅ www.phpmyfaq.de deployed" ;;
            failure) subject="❌ www.phpmyfaq.de deployment failed" ;;
            skipped) subject="⏭️ www.phpmyfaq.de not deployed: tests were not green" ;;
            *)       subject="⚠️ www.phpmyfaq.de deployment $RESULT" ;;
          esac
          commit=$(gh api "repos/${{ github.repository }}/commits/$SHA" --jq '"\(.commit.message | split("\n")[0]) (\(.commit.author.name))"')
          {
            echo "subject=$subject"
            echo "body<<BODY"
            echo "Result:  $RESULT"
            echo "Commit:  ${SHA:0:7} $commit"
            echo "Run:     ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "Site:    https://www.phpmyfaq.de"
            echo "BODY"
          } >> "$GITHUB_OUTPUT"

      - name: Send e-mail
        # Mail trouble must never turn a successful deployment red.
        if: env.MAIL_SERVER != ''
        continue-on-error: true
        env:
          MAIL_SERVER: ${{ secrets.MAIL_SERVER }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.MAIL_SERVER }}
          server_port: ${{ secrets.MAIL_PORT || 465 }}
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: phpMyFAQ Deploy <${{ secrets.MAIL_FROM }}>
          to: ${{ secrets.MAIL_TO }}
          subject: ${{ steps.outcome.outputs.subject }}
          body: ${{ steps.outcome.outputs.body }}